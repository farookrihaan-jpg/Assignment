<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Newsletter Signup</title>
</head>
<body>

    <h2>Newsletter Signup</h2>

    <form action="" method="post">

        <label for="fullname">Subscriber Name:</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="yourname@example.com" required><br><br>

        <label for="password">Create Access Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Set a password for login" required><br><br>

        <button type="submit">Subscribe</button>
    </form>

</body>
</html>
