<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>

<body>

    <form action="" method="post">
        <fieldset>
            <legend> <h1>Registration Form </h1></legend>
            <p>Please fill out the form below to register. </p>

                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" placeholder="example@email.com" required><br><br>

                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" placeholder="Create a password" required><br><br>

                <label>Gender:</label><br>
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label><br>

                <input type="radio" id="female" name="gender" value="Female" required>
                <label for="female">Female</label><br>

                <input type="radio" id="other" name="gender" value="Other" required>
                <label for="other">Other</label><br><br>

                <label>Select Your Hobbies:</label><br>
                <input type="checkbox" id="reading" name="hobbies" value="Reading">
                <label for="reading">Reading</label><br>

                <input type="checkbox" id="traveling" name="hobbies" value="Traveling">
                <label for="traveling">Traveling</label><br>

                <input type="checkbox" id="sports" name="hobbies" value="Sports">
                <label for="sports">Sports</label><br><br>

                <label for="age">Age:</label><br>
                <input type="number" id="age" name="age" placeholder="Enter your age" min="1" max="120" required><br><br>

                <button type="submit">Register</button>
            
        </fieldset>


    </form>

</body>

</html>
