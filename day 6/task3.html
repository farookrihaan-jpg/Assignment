<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Order Form</title>
</head>
<body>

    <h2>Food Order Form</h2>

    <form action="" method="post">

        <h1>Select your food items:</h1>
        <input type="checkbox" id="pizza" name="food" value="Pizza">
        <label for="pizza">Pizza</label><br>

        <input type="checkbox" id="burger" name="food" value="Burger">
        <label for="burger">Burger</label><br>

        <input type="checkbox" id="pasta" name="food" value="Pasta">
        <label for="pasta">Pasta</label><br><br>

        <h1>Select your drink size:</h1>
        <input type="radio" id="small" name="drink" value="Small">
        <label for="small">Small</label><br>

        <input type="radio" id="medium" name="drink" value="Medium">
        <label for="medium">Medium</label><br>

        <input type="radio" id="large" name="drink" value="Large">
        <label for="large">Large</label><br><br>

        <h1>Enter number of items:</h1>
        <input type="number" id="quantity" name="quantity" required><br><br>

        <button type="submit">Place Order</button>
    </form>

</body>
</html>
