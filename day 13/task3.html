<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .em {
            font-size: 5em;
        }

        .rem {
            font-size: 5rem;
        }

        .px {
            font-size: 80px;
        }

        div {
            background-color: rgb(145, 182, 182);
            color: rgb(255, 24, 213);
            border-radius: 20px;
        }

        h2 {
            border: 20px dotted rgb(15, 15, 24);
            border-radius: 30px;
        }

        h1 {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="em">
        <h1>em</h1>
        <h2>Em-depends on parent (20 × 2 = 40px)</h2>
    </div>
    <div class="rem">
        <h1>rem</h1>
        <h2>Rem-depends on root (16 × 2 = 32px)</h2>
    </div>
    <div class="px">
        <h1>px</h1>
        <h2>px-pixel</h2>
    </div>
</body>

</html>
