<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>


    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f7fa;
            margin: 40px;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        form {
            border: 2px solid #ccc;
            padding: 20px;
            width: 50%;
            margin: auto;
            background-color: #fff;
            border-radius: 20px;
        }

        label {
            display: inline-block;
            width: 270px;
        }
    </style>


    <link rel="stylesheet" href="task5.css">
</head>
<body>

    <h1 style="color: darkblue; background-color: rgb(132, 201, 201); border: 2px solid black; padding: 10px;">
        User Registration Form
    </h1>

    <form>
        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your name"><br><br>

        <label>Username:</label>
        <input type="text" name="username" placeholder="Enter username"><br><br>

        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter password"><br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter email"><br><br>

        <label>Age:</label>
        <input type="number" name="age" placeholder="Enter age"><br><br>

        <label>Phone:</label>
        <input type="tel" name="phone" placeholder="Enter phone number"><br><br>

        <label>Upload Resume:</label>
        <input type="file" name="resume"><br><br>

        <input type="submit" value="Register">
    </form>
</body>
</html>
