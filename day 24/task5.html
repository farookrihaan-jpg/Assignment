<!-- Create a function that throws an error when the input number is negative. -->
 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Throw Error Example</title>
</head>
<body>
  <h2>Enter a number:</h2>
  <input type="number" id="numInput" placeholder="Enter a number">
  <button onclick="checkNumber()">Check</button>
  <p id="message"></p>

  <script>
    function validateNumber(num) {
      if (num < 0) {
        throw new Error("Negative numbers are not allowed!");
      }
      return "Valid number: " + num;
    }

    function checkNumber() {
      const message = document.getElementById("message");
      const num = Number(document.getElementById("numInput").value);

      try {
        const result = validateNumber(num);
        message.textContent = result;
      } catch (error) {
        message.textContent = "Error: " + error.message;
        console.error(error.message);
      }
    }
  </script>
</body>
</html>
