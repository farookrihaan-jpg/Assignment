<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property Example</title>
    <style>
        .block span {
            display: block;
            background-color: #ffb6b9;
            margin: 5px;
            padding: 10px;
            border: 2px solid #ff6f61;
        }

        .inline p {
            display: inline;
            background-color: #c6e2ff;
            margin: 5px;
            padding: 8px;
            border: 2px solid #4682b4;
        }

        .inlineblock p {
            display: inline-block;
            background-color: #c1f0c1;
            margin: 5px;
            padding: 10px;
            border: 2px solid #3cb371;
            width: 120px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="block">
        <h1>Display Block Example</h1>
        <span>Mountains are beautiful and peaceful.</span>
        <span>Each mountain range has its own charm and mystery.</span>
    </div>

    <div class="inline">
        <h2>Display Inline Example</h2>
        <p>Learning</p>
        <p>is</p>
        <p>fun</p>
        <p>with</p>
        <p>practice!</p>
    </div>

    <div class="inlineblock">
        <h2>Display Inline-Block Example</h2>
        <p>Box A</p>
        <p>Box B</p>
        <p>Box C</p>
        <p>Box D</p>
    </div>
</body>

</html>
