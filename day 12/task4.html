<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Showcase</title>
  <style>

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: rgb(205, 156, 205);
      margin: 0;
      padding: 0;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #0d47a1;
      margin-top: 30px;
    }

    h2 {
      text-align: center;
      color: #01579b;
      margin-top: 40px;
    }

    .cont,
    .conaa {
      background-color: #ffffff;
      border-radius: 15px;
      margin: 30px auto;
      padding: 20px;
      
    }

    .cont {
      display: flex;
      flex-direction: row;
      justify-content: space-around;  
      width: 80%;  
    }

    .conaa {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 20%;
    }

    .cont div,
    .conaa div {
      background-color: #bbdefb;
      border-radius: 12px;
      padding: 25px;
      margin: 10px;
      text-align: center;
      font-size: 20px;
      width: 120px;
      transition: 0.3s;
    }

    .cont div:hover,
    .conaa div:hover {
      background-color: #64b5f6;
      color: white;
      transform: translateY(-5px) scale(1.05);
      cursor: pointer;
    }


    footer {
      text-align: center;
      padding: 20px;
      background-color: #0d47a1;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <h1>Flexbox Layout Showcase</h1>

  <h2>Horizontal Flexbox — Navigation Menu</h2>
  <div class="cont">
    <div> Home</div>
    <div> About</div>
    <div> Services</div>
    <div> Gallery</div>
    <div> Team</div>
    <div> Blog</div>
    <div> Contact</div>
  </div>

  <h2>Vertical Flexbox — Sidebar Menu</h2>
  <div class="conaa">
    <div> Profile</div>
    <div> Messages</div>
    <div> Schedule</div>
    <div> Settings</div>
    <div> Support</div>
    <div> Logout</div>
  </div>

  <footer>
    Created with Mohammed Rihaan M
  </footer>
</body>

</html>
