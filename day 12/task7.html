<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
            color: #0d47a1;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 20px;
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .product {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .product:hover {
            transform: scale(1.1);
        }

        .product h2 {
            font-size: 20px;
            margin: 10px 0 5px;
            color: #0d47a1;
        }

        .product p {
            font-size: 16px;
            color: #555;
            margin: 0;
        }
    </style>
</head>

<body>
    <h1>Product Grid</h1>

    <div class="product-grid">
        <div class="product">
            <img src="./images/Smart Watch.webp" alt="Product 1">
            <h2>Smart Watch</h2>
            <p>₹<del>15000</del><br>₹4599</p>
        </div>

        <div class="product">
            <img src="./images/Wireless Headphones.webp" alt="Product 2">
            <h2>Wireless Headphones</h2>
            <p>₹<del>13000</del><br>₹5999</p>
        </div>

        <div class="product">
            <img src="./images/Gaming Mouse.webp" alt="Product 3">
            <h2>Gaming Mouse</h2>
            <p>₹6000</p>
        </div>

        <div class="product">
            <img src="./images/Bluetooth Speaker.jpg" alt="Product 4">
            <h2>Bluetooth Speaker</h2>
            <p>₹4000</p>
        </div>

        <div class="product">
            <img src="./images/Laptop Stand.webp" alt="Product 5">
            <h2>    </h2>
            <p>₹2000</p>
        </div>

    </div>
</body>

</html>
